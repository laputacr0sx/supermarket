[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "store"
version = "0.1.0"
description = "Play supermarket till — Phase 6 phone play day"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx2>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "reportlab>=4.2",
]

[project.optional-dependencies]
kiosk = ["pygame-ce>=2.5"]
linux = ["evdev>=1.7", "pyscard>=2.1", "python-escpos>=3.1"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.14"]

[project.scripts]
store-api = "store.api.app:run"
store-seed = "store.seed:run"
store-doctor = "store.doctor:run"
store-scan = "store.scan_cli:run"
store-labels = "store.labels_cli:run"
store-enroll = "store.enroll_cli:run"
store-tap = "store.tap_cli:run"
store-kiosk = "store.kiosk.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." so `uv run pytest` (console script) can import `tests.*`; `src` for the package.
pythonpath = [".", "src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
include = ["src/**/*.py", "tests/**/*.py"]
force-exclude = true
extend-exclude = [".venv", "venv", "alembic", "prototypes"]

[tool.ruff.lint]
select = ["E", "F", "ANN"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["ANN"]
"src/store/kiosk/draw.py" = ["ANN401"]
"src/store/kiosk/main.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
files = ["src/store", "tests"]
exclude = ["(?x)(prototypes/|alembic/|src/store\\.egg-info/)"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_reexport = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = [
  "pygame",
  "pygame.*",
  "evdev",
  "smartcard",
  "reportlab",
  "reportlab.*",
  "httpx2",
]
ignore_missing_imports = true
