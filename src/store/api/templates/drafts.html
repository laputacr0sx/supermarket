{% extends "base.html" %}
{% block title %}未完成{% endblock %}
{% block heading %}未完成{% endblock %}
{% block body %}
<form method="post" action="/learn">
  <input name="barcode" placeholder="家庭條碼" required>
  <button type="submit">記低</button>
</form>
{% if not drafts %}
  <p>沒有草稿。</p>
{% else %}
<form method="post" action="/reprint.pdf">
  {% for p in drafts %}
    <label class="card" style="display:block">
      <input type="checkbox" name="barcodes" value="{{ p.barcode }}">
      <code>{{ p.barcode }}</code>
    </label>
  {% endfor %}
  <button type="submit">再印勾選</button>
</form>
{% for p in drafts %}
  <div class="card">
    <code>{{ p.barcode }}</code>
    <form method="post" action="/products/{{ p.barcode }}/finish" enctype="multipart/form-data">
      <input name="name" placeholder="名" required>
      <input name="yuan" type="number" min="0" step="1" placeholder="元" required>
      <input name="photo" type="file" accept="image/*" capture="environment">
      <button type="submit">上架</button>
    </form>
    <form method="post" action="/products/{{ p.barcode }}/drop">
      <button class="dim" type="submit">刪</button>
    </form>
  </div>
{% endfor %}
{% endif %}
{% endblock %}
